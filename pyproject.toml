[project]
name = "churn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow",
    "openpyxl",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "fastapi>=0.110",
    "uvicorn",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
